name: Fork build check (simulator, no signing)

# Compiles Trio (including the embedded Watch app) for the iOS Simulator and
# runs the "Trio Tests" unit tests. No Apple Developer account or secrets are
# needed. Adapted from unit_tests.yml, which only runs on nightscout/Trio.

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/**'
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and run unit tests
    runs-on: macos-26
    timeout-minutes: 120

    env:
      DESTINATION: "platform=iOS Simulator,name=iPhone 17,OS=26.2"

    steps:
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace Trio.xcworkspace \
            -scheme "Trio Tests" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -workspace Trio.xcworkspace \
            -scheme "Trio Tests" \
            -destination "$DESTINATION" \
            -onlyUsePackageVersionsFromResolvedFile \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | tee xcodebuild-build.log

      - name: Surface build errors
        if: failure()
        run: |
          grep -nE "error:|Undefined symbol|PhaseScriptExecution failed|BUILD FAILED" xcodebuild-build.log | tail -n 80 || true

      - name: Show formatting changes made by the SwiftFormat build phase
        if: always()
        run: git diff --stat && git diff | head -n 200

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -workspace Trio.xcworkspace \
            -scheme "Trio Tests" \
            -destination "$DESTINATION" \
            -parallel-testing-enabled NO \
            2>&1 | tee xcodebuild.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild-build.log
            xcodebuild.log
          if-no-files-found: ignore
